<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
  </head>

  <body>
    <p id="status">Loading...</p>
    <video id="trailer" controls style="max-width:100%"></video>

    <script>
      const API = "https://steamstagram.onrender.com";

      fetch(API + "/details?appid=367520")
        .then(res => res.json())
        .then(data => {
          const info = data["367520"];
          document.getElementById("status").textContent = info.data.title;
          document.getElementById("trailer"),src = info.data.movies[0].mp4.max;
        });
    </script>
  </body>
</html>
